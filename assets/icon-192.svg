<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="188" height="188" rx="40" fill="none" stroke="rgba(52, 211, 153, 0.3)" stroke-width="2" />
  
  <!-- Infrastructure Bridge & Crane Pylon Symbol -->
  <g transform="translate(24, 28)">
    <!-- Base / Foundation Line -->
    <path d="M 10 115 L 134 115" stroke="rgba(255,255,255,0.25)" stroke-width="4" stroke-linecap="round" />
    
    <!-- Pylons / Towers -->
    <path d="M 38 115 L 50 35 L 58 35 L 70 115" fill="none" stroke="url(#accentGrad)" stroke-width="5" stroke-linejoin="round" />
    <path d="M 86 115 L 98 48 L 104 48 L 116 115" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Cross Bracing -->
    <path d="M 43 78 L 65 78" stroke="url(#accentGrad)" stroke-width="4" />
    <path d="M 91 85 L 111 85" stroke="url(#accentGrad)" stroke-width="3" />
    
    <!-- Suspension Cables -->
    <path d="M 12 70 Q 54 40 72 35" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <path d="M 54 35 Q 85 45 101 48" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <path d="M 101 48 Q 120 70 134 85" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Project Finance Shield / Shielding Ring -->
    <circle cx="72" cy="75" r="46" fill="none" stroke="rgba(52, 211, 153, 0.4)" stroke-width="2" stroke-dasharray="4 4" />
    
    <!-- Currency / Capital Node -->
    <circle cx="72" cy="75" r="14" fill="#047857" stroke="#34D399" stroke-width="2" />
    <text x="72" y="80" font-family="-apple-system, sans-serif" font-weight="900" font-size="14" fill="#ECFDF5" text-anchor="middle">$</text>
  </g>
</svg>
